baseURL: /
languageCode: en-us
title: KaraokeArcade
permalinks:
  page: "/:slug/"
markup:
  highlight:
    # Classes, not inline colours: the code palette is defined in deck.scss out
    # of the app's own inks, so a highlighted block stays inside the system
    # instead of importing a second one.
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
disableKinds: ["taxonomy", "RSS"]
enableRobotsTXT: true
params:
  # baseURL stays "/" so Vercel preview deploys link to themselves. Anything a
  # crawler or a link unfurler reads must be absolute, and uses this instead.
  siteURL: https://www.karaokearcade.com
  description: Your TV is the stage, everybody's phone is the remote, and nobody installs anything. Karaoke, music trivia and singer battles in one queue. Self-hosted, ad-free and open source.
  ogImage: brand/og-image.jpg
  ogImageAlt: A Singer Battle on the TV, with the room's vote on a phone
  repo: https://github.com/matt-antone/KaraokeArcade
