{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{ range .Pages.GroupByParam "category" }}
    <h2 id="{{ anchorize .Key }}">{{ .Key }}</h2>
    {{ range .Pages.ByWeight }}
      <h3 id="{{ .File.TranslationBaseName }}">{{ .Title }}</h3>
      {{ .Content }}
    {{ end }}
  {{ end }}
{{ end }}
