baseURL: /
languageCode: en-us
title: KaraokeArcade
permalinks:
  page: "/:slug/"
markup:
  highlight:
    # Classes, not inline colours: the code palette is defined in deck.scss out
    # of the app's own inks, so a highlighted block stays inside the system
    # instead of importing a second one.
    noClasses: false
  goldmark:
    renderer:
      unsafe: true
disableKinds: ["taxonomy", "RSS"]
