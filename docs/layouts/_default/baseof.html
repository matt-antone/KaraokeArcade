<!DOCTYPE html>
<html lang="en-us">
{{ partial "head.html" . }}

<body{{ if .IsHome }} class="home"{{ end }}>
  {{ if .IsHome }}{{ partial "topbar.html" . }}{{ else }}{{ partial "sidebar.html" . }}{{ end }}
  <div class="content container">
    {{ block "main" . }}
    {{ end }}
  </div>
  {{ partial "footer.html" . }}
  <script src='{{ (resources.Get "js/gumshoe.min.js").Permalink }}'></script>
  <script src='{{ (resources.Get "js/main.js").Permalink }}'></script>
  <script src='{{ (resources.Get "js/copy-code.js").Permalink }}'></script>
</body>

</html>
