<!doctype html>
<html lang="en">
<head>
  <title>KaraokeArcade</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#141414">
  <!-- paths are relative so they follow the <base href> the server rewrites for subpath installs -->
  <link rel="manifest" href="assets/manifest.webmanifest">
  <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/brand/apple-touch-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- iOS below 17.4 only reads the apple- prefixed form -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="KaraokeArcade">
</head>
<body>
  <div id="root" style="height: 100%"></div>
</body>
</html>
